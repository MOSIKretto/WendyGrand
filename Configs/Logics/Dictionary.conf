# КОНФИГ ОСНОВНОГО СЛОВАРЯ "Wendy"

# Из-за использования малой модели Vosk могут быть некоторые неточности. 
# Поэтому слова могут быть записаны немного странно, особенно в разделе ПОЛУИЗМЕНЯЕМЫЕ (которые уже есть).
# Слова записаны с учетом: 1) Универсальности, 2) Склонений русского языка, 3) Возможности ошибки модели Vosk.
# Также стоит понимать, что Vosk воспринимает только русский язык. 
# Если вы захотите добавить английское слово, модель может обрабатывать его некорректно.
# Пример: "VScode" будет распознано как "в с кот".



# СЛОВА-ПАРАЗИТЫ (ДЛЯ УДАЛЕНИЯ) ----------------------------------------------------------------------------------
